<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Game created by Alejandro del Valle alias AlejAndroiDeVV-->
    <!-- Game Panel -->
    <div id="game_screen">

        <!-- Game Information -->
        <div id="game_info">
            <select id="dificulty">
                <optgroup label="Dificultad">
                    <option value="easy" selected>Facil</option>
                    <option value="normal">Normal</option>
                    <option value="hard">Dificil</option>
                    <option value="friend">Con un Amigo</option>
                </optgroup>
            </select><br>
            <div id="player">
                <input type="radio" id="player-x" class="player" name="simbol" value="true">
                <label for="player-x">X</label>
                <input type="radio" id="player-o" class="player" name="simbol" value="false">
                <label for="player-o">O</label>
            </div>
            <h2>Turno de <b id="game_turn">X</b></h2>
        </div>
        
        <!-- Game Board -->
        <table id="board">
            <tr>
                <td id="position_0"><button type="button" class="board_btn" value="0"></button></td>
                <td id="position_1"><button type="button" class="board_btn" value="1"></button></td>
                <td id="position_2"><button type="button" class="board_btn" value="2"></button></td>
            </tr>
            <tr>
                <td id="position_3"><button type="button" class="board_btn" value="3"></button></td>
                <td id="position_4"><button type="button" class="board_btn" value="4"></button></td>
                <td id="position_5"><button type="button" class="board_btn" value="5"></button></td>
            </tr>
            <tr>
                <td id="position_6"><button type="button" class="board_btn" value="6"></button></td>
                <td id="position_7"><button type="button" class="board_btn" value="7"></button></td>
                <td id="position_8"><button type="button" class="board_btn" value="8"></button></td>
            </tr>
        </table>
        <button id="restart">Reiniciar Partida</button>
    </div>
</body>
<script src="game.js"></script>
</html>
